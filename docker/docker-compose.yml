services:
  localstack:
    image: localstack/localstack:3.8.1
    container_name: care-circle-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,sqs,sns
      - DEFAULT_REGION=us-east-1
    volumes:
      - ./init-localstack.sh:/etc/localstack/init/ready.d/init-localstack.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: care-circle-app
    ports:
      - "8080:8080"
    environment:
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - SQS_QUEUE_URL=http://localstack:4566/000000000000/checkin-queue
      - ALERTS_QUEUE_URL=http://localstack:4566/000000000000/alerts-queue
    depends_on:
      localstack:
        condition: service_healthy